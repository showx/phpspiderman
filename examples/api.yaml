# JSON 接口采集源。这是公开测试接口。
# ./gospider source add -c examples/api.yaml
# ./gospider run cat-breeds
name: cat-breeds
mode: api
workers: 2
timeout: 20s
retry: 2
delay: 200ms
request:
  url: https://catfact.ninja/breeds
  method: GET
page:
  in: query
  param: page
  start: 1
  total_pages: last_page
list: data
fields:
  - name: breed
  - name: country
  - name: origin
  - name: coat
  - name: pattern
output:
  format: jsonl
  path: data/breeds.jsonl
